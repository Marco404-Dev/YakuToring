services:
  - type: web
    name: yakutoring-api
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: YAKUTORING_SERIAL_MODE
        value: agent
      - key: YAKUTORING_ACTIVE_MODELS
        value: catboost
      - key: YAKUTORING_MONITOR_ENVIRONMENT
        value: manglar
      - key: YAKUTORING_ML_DB_PATH
        value: /app/.local/ml.sqlite
      - key: YAKUTORING_TELEMETRY_PATH
        value: /app/.local/telemetry.jsonl
      - key: YAKUTORING_USERS_JSON
        sync: false
      - key: YAKUTORING_FRONTEND_ORIGIN
        sync: false
      - key: YAKUTORING_INGEST_TOKEN
        generateValue: true
